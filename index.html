<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>自選股殖利率</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0b0b0e; color: #e8e8ec; min-height: 100vh;
    font-family: 'Helvetica Neue', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
    padding: max(12px, env(safe-area-inset-top)) 0 40px;
    max-width: 560px; margin: 0 auto;
  }
  .header { display: flex; justify-content: space-between; align-items: center; padding: 4px 16px 12px; }
  .title { font-size: 22px; font-weight: 700; letter-spacing: 2px; }
  button {
    background: #1b1b20; color: #e8e8ec; border: 1px solid #2c2c33;
    border-radius: 8px; padding: 6px 14px; font-size: 14px; cursor: pointer;
  }
  .col-head {
    display: flex; align-items: center; padding: 8px 16px;
    font-size: 13px; color: #8a8a93; border-bottom: 1px solid #1c1c22;
  }
  #table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .col-head, .row { display: flex; align-items: center; width: max-content; min-width: 100%; }
  .col-head {
    padding: 8px 16px 8px 0;
    font-size: 13px; color: #8a8a93; border-bottom: 1px solid #1c1c22;
  }
  .col-head span { flex: 0 0 auto; width: 96px; text-align: right; }
  .col-head .first {
    width: 140px; text-align: left;
    position: sticky; left: 0; z-index: 2; background: #0b0b0e; padding-left: 16px;
  }
  .col-head .yield { color: #d9a948; }
  .col-head .myyield { color: #6fb3f2; width: 110px; }
  .row { padding: 16px 16px 16px 0; border-bottom: 1px solid #17171c; background: #0b0b0e; }
  .row .name-cell {
    flex: 0 0 auto; width: 140px; min-width: 0;
    position: sticky; left: 0; z-index: 1; background: #0b0b0e; padding-left: 16px;
    box-shadow: 8px 0 8px -6px rgba(0,0,0,.7);
  }
  .stock-name { font-size: 17px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stock-code { font-size: 13px; color: #8a8a93; margin-top: 4px; display: flex; align-items: center; gap: 6px; }
  .tag { background: #2a4ea3; color: #dfe8ff; font-size: 11px; border-radius: 4px; padding: 1px 5px; }
  .tag.otc { background: #7a5a1e; color: #ffeccb; }
  .cell { flex: 0 0 auto; width: 96px; text-align: right; font-variant-numeric: tabular-nums; }
  .cell:last-of-type { width: 110px; }
  .px { font-size: 18px; font-weight: 700; }
  .delta { font-size: 17px; font-weight: 700; }
  .delta-pct { font-size: 12px; margin-top: 2px; opacity: .85; }
  .yield-note { font-size: 11px; color: #8a8a93; margin-top: 2px; }
  .up { color: #f0334b; } .down { color: #2ebd6b; } .flat { color: #e8e8ec; }
  .gold { color: #f2c863; } .gray { color: #9a9aa3; } .dim { color: #55555e; }
  .blue { color: #6fb3f2; }
  .cost-cell { cursor: pointer; }
  .cost-empty { font-size: 13px; color: #6fb3f2; border: 1px dashed #3a5a7a; border-radius: 6px; padding: 4px 8px; display: inline-block; }
  .msg { margin: 12px 16px; padding: 10px 12px; border-radius: 8px; font-size: 13px; }
  .msg.error { background: #2a1518; border: 1px solid #5c2a31; color: #f0a0aa; }
  .msg.info { background: #14202e; border: 1px solid #27405c; color: #9fc3ee; }
  .add-row { display: flex; gap: 8px; padding: 14px 16px; }
  input {
    flex: 1; background: #1b1b20; border: 1px solid #2c2c33; border-radius: 8px;
    color: #e8e8ec; padding: 8px 12px; font-size: 16px; outline: none;
  }
  .btn-primary { background: #2a6df0; border-color: #2a6df0; }
  .del-btn {
    width: 30px; height: 30px; margin-left: 8px; border-radius: 50%;
    border: 1px solid #5c2a31; background: #2a1518; color: #f0a0aa; font-size: 13px; padding: 0;
  }
  .footer { padding: 16px 16px 0; font-size: 11px; color: #62626b; line-height: 1.6; }
  .hidden { display: none; }
</style>
</head>
<body>
  <div class="header">
    <div class="title">自選股</div>
    <div style="display:flex;gap:8px">
      <button id="editBtn">編輯</button>
      <button id="refreshBtn">↻ 更新</button>
    </div>
  </div>

  <div id="msg"></div>

  <div id="table-wrap">
    <div class="col-head">
      <span class="first">商品</span><span>成交</span><span class="yield">今年殖利率</span><span>股利</span><span>均價</span><span class="myyield">我的殖利率</span>
    </div>
    <div id="list"></div>
  </div>

  <div class="add-row hidden" id="addRow">
    <input id="codeInput" placeholder="輸入股票代號,例如 2330" inputmode="numeric">
    <button class="btn-primary" id="addBtn">加入</button>
  </div>

  <div class="footer" id="footer">
    金色為今年已公告現金股利換算;灰色為近一年股利估算。資料來源:臺灣證券交易所、櫃買中心(收盤資料,非即時)。僅供參考,投資前請以公開資訊觀測站為準。
  </div>

<script>
const URLS = {
  twseDaily: "https://openapi.twse.com.tw/v1/exchangeReport/STOCK_DAY_ALL",
  twseYield: "https://openapi.twse.com.tw/v1/exchangeReport/BWIBBU_ALL",
  twseDiv:   "https://openapi.twse.com.tw/v1/opendata/t187ap45_L",
  tpexDaily: "https://www.tpex.org.tw/openapi/v1/tpex_mainboard_daily_close_quotes",
  tpexYield: "https://www.tpex.org.tw/openapi/v1/tpex_mainboard_peratio_analysis",
  tpexDiv:   "https://www.tpex.org.tw/openapi/v1/tpex_exright_prepost",
};
const DEFAULT_LIST = ["0050", "3557", "8112"];

let codes = JSON.parse(localStorage.getItem("watchlist") || "null") || DEFAULT_LIST;
let quotes = JSON.parse(localStorage.getItem("quotes-cache") || "{}");
let costs = JSON.parse(localStorage.getItem("costs") || "{}");
let editing = false;

const $ = (id) => document.getElementById(id);
const num = (v) => {
  const n = parseFloat(String(v ?? "").replace(/,/g, ""));
  return Number.isFinite(n) ? n : null;
};
const pick = (row, keys) => {
  for (const k of keys) if (row[k] !== undefined && row[k] !== null && row[k] !== "") return row[k];
  return null;
};
const save = () => localStorage.setItem("watchlist", JSON.stringify(codes));

async function fetchJson(url) {
  // 證交所/櫃買 API 不允許跨網站直接呼叫,依序嘗試:直連 → 兩個免費中繼服務
  const candidates = [
    url,
    "https://api.allorigins.win/raw?url=" + encodeURIComponent(url),
    "https://corsproxy.io/?url=" + encodeURIComponent(url),
  ];
  for (const u of candidates) {
    try {
      const r = await fetch(u, { headers: { Accept: "application/json" } });
      if (!r.ok) throw new Error("HTTP " + r.status);
      const data = await r.json();
      if (Array.isArray(data)) return data;
    } catch (e) {
      console.warn("抓取失敗,換下一個來源", u, e);
    }
  }
  return [];
}

function setMsg(type, text) {
  $("msg").innerHTML = text ? '<div class="msg ' + type + '">' + text + "</div>" : "";
}

async function refresh() {
  $("refreshBtn").disabled = true;
  $("refreshBtn").textContent = "更新中…";
  setMsg("", "");
  try {
    const [twDaily, twYield, twDiv, tpDaily, tpYield, tpDiv] = await Promise.all([
      fetchJson(URLS.twseDaily), fetchJson(URLS.twseYield), fetchJson(URLS.twseDiv),
      fetchJson(URLS.tpexDaily), fetchJson(URLS.tpexYield), fetchJson(URLS.tpexDiv),
    ]);
    if (!twDaily.length && !tpDaily.length) {
      throw new Error("無法連線到證交所/櫃買中心,請確認網路後重試");
    }
    const map = {};
    const fill = (rows, market) => {
      for (const row of rows) {
        const code = String(pick(row, ["Code", "證券代號", "SecuritiesCompanyCode", "代號"]) || "").trim();
        if (!code) continue;
        if (!map[code]) map[code] = { code, market };
        map[code].name = String(pick(row, ["Name", "證券名稱", "CompanyName", "名稱"]) || map[code].name || "").trim();
        const close = num(pick(row, ["ClosingPrice", "收盤價", "Close", "收盤"]));
        const change = num(pick(row, ["Change", "漲跌價差", "漲跌"]));
        if (close != null) map[code].close = close;
        if (change != null) map[code].change = change;
      }
    };
    fill(twDaily, "twse");
    fill(tpDaily, "tpex");
    for (const row of [...twYield, ...tpYield]) {
      const code = String(pick(row, ["Code", "證券代號", "SecuritiesCompanyCode", "股票代號"]) || "").trim();
      if (!map[code]) continue;
      const y = num(pick(row, ["DividendYield", "殖利率(%)", "殖利率", "DividendYieldRatio"]));
      if (y != null) map[code].lastYearYield = y;
    }
    const year = new Date().getFullYear();
    // 上市:股利分派情形(t187ap45_L)。「今年配發」= 股利年度為民國去年(去年盈餘今年配發)
    const rocPrevYear = String(year - 1912);
    const seen = {};
    for (const row of twDiv) {
      const code = String(row["公司代號"] || "").trim();
      if (!map[code]) continue;
      if (String(row["股利年度"] || "").trim() !== rocPrevYear) continue;
      const cash = (num(row["股東配發-盈餘分配之現金股利(元/股)"]) || 0)
        + (num(row["股東配發-法定盈餘公積發放之現金(元/股)"]) || 0)
        + (num(row["股東配發-資本公積發放之現金(元/股)"]) || 0);
      const stock = (num(row["股東配發-盈餘轉增資配股(元/股)"]) || 0)
        + (num(row["股東配發-法定盈餘公積轉增資配股(元/股)"]) || 0)
        + (num(row["股東配發-資本公積轉增資配股(元/股)"]) || 0);
      // 同一期別可能先「擬議」後「決議」,以後出現者為準避免重複累計
      const key = code + "|" + String(row["期別"] || "") + "|" + String(row["股利所屬期間"] || "");
      seen[key] = { code, cash, stock };
    }
    for (const k in seen) {
      const it = seen[k];
      if (it.cash > 0) map[it.code].cashThisYear = (map[it.code].cashThisYear || 0) + it.cash;
      if (it.stock > 0) map[it.code].stockThisYear = (map[it.code].stockThisYear || 0) + it.stock;
    }
    // 上櫃:沿用除權息預告表
    for (const row of tpDiv) {
      const code = String(pick(row, ["Code", "公司代號", "股票代號", "SecuritiesCompanyCode"]) || "").trim();
      if (!map[code]) continue;
      const cash = num(pick(row, ["CashDividend", "現金股利", "現金股利(元/股)", "Cash"])) || 0;
      const stock = num(pick(row, ["StockDividend", "股票股利", "盈餘配股(元/股)", "盈餘配股"])) || 0;
      const dateStr = String(pick(row, ["Date", "除權息日期", "資料日期", "ExRightExDividendDate"]) || "");
      const roc = dateStr.match(/^(\d{3})\D/);
      const adYear = roc ? parseInt(roc[1], 10) + 1911
        : (dateStr.match(/^(\d{4})/) ? parseInt(dateStr.slice(0, 4), 10) : year);
      if (adYear === year && cash > 0) {
        map[code].cashThisYear = (map[code].cashThisYear || 0) + cash;
      }
      if (adYear === year && stock > 0) {
        map[code].stockThisYear = (map[code].stockThisYear || 0) + stock;
      }
    }
    quotes = {};
    for (const c of codes) if (map[c]) quotes[c] = map[c];
    quotes._time = new Date().toISOString();
    localStorage.setItem("quotes-cache", JSON.stringify(quotes));
    render();
  } catch (e) {
    setMsg("error", "資料抓取失敗:" + e.message);
    render();
  } finally {
    $("refreshBtn").disabled = false;
    $("refreshBtn").textContent = "↻ 更新";
  }
}

function render() {
  const list = $("list");
  list.innerHTML = "";
  for (const c of codes) {
    const q = quotes[c] || {};
    const up = (q.change ?? 0) > 0, down = (q.change ?? 0) < 0;
    const cls = up ? "up" : down ? "down" : "flat";
    const pct = q.close && q.change != null && q.close - q.change !== 0
      ? (q.change / (q.close - q.change)) * 100 : null;
    const yieldPct = q.cashThisYear && q.close ? (q.cashThisYear / q.close) * 100 : null;
    const arrow = up ? "▲" : down ? "▼" : "";
    const tag = q.market === "tpex" ? '<span class="tag otc">櫃</span>' : '<span class="tag">市</span>';

    let yieldHtml;
    if (yieldPct != null) {
      yieldHtml = '<div class="px gold">' + yieldPct.toFixed(2) + '%</div>'
        + '<div class="yield-note">配 ' + q.cashThisYear.toFixed(2) + ' 元</div>';
    } else if (q.lastYearYield != null) {
      yieldHtml = '<div class="px gray">' + q.lastYearYield.toFixed(2) + '%</div>'
        + '<div class="yield-note">近年・尚未公告</div>';
    } else {
      yieldHtml = '<div class="px dim">—</div>';
    }

    const row = document.createElement("div");
    row.className = "row";

    const cost = costs[c];
    let costHtml;
    if (cost != null) {
      costHtml = '<div class="px">' + cost.toFixed(2) + '</div>'
        + '<div class="yield-note">點此修改</div>';
    } else {
      costHtml = '<span class="cost-empty">輸入均價</span>';
    }

    let myYieldHtml;
    if (q.cashThisYear && cost) {
      myYieldHtml = '<div class="px blue">' + (q.cashThisYear / cost * 100).toFixed(2) + '%</div>'
        + '<div class="yield-note">以均價計</div>';
    } else if (cost) {
      myYieldHtml = '<div class="px dim">—</div>'
        + '<div class="yield-note">尚未公告</div>';
    } else {
      myYieldHtml = '<div class="px dim">—</div>';
    }

    let divHtml;
    if (q.cashThisYear || q.stockThisYear) {
      divHtml = '<div class="px gold" style="font-size:14px">現 '
        + (q.cashThisYear ? q.cashThisYear.toFixed(2) : "0.00") + '</div>'
        + '<div class="yield-note">股 ' + (q.stockThisYear ? q.stockThisYear.toFixed(2) : "0.00") + '</div>';
    } else {
      divHtml = '<div class="px dim">—</div><div class="yield-note">尚未公告</div>';
    }

    row.innerHTML =
      '<div class="name-cell">'
      + '<div class="stock-name">' + (q.name || "—") + '</div>'
      + '<div class="stock-code">' + tag + c + '</div>'
      + '</div>'
      + '<div class="cell ' + cls + '">'
      + '<div class="px">' + (q.close != null ? q.close.toFixed(2) : "—") + '</div>'
      + '<div class="delta-pct">' + (q.change != null ? arrow + Math.abs(q.change).toFixed(2) : "")
      + (pct != null ? " " + (pct >= 0 ? "+" : "") + pct.toFixed(2) + "%" : "") + '</div>'
      + '</div>'
      + '<div class="cell">' + yieldHtml + '</div>'
      + '<div class="cell">' + divHtml + '</div>'
      + '<div class="cell cost-cell" data-code="' + c + '">' + costHtml + '</div>'
      + '<div class="cell">' + myYieldHtml + '</div>'
      + (editing ? '<button class="del-btn" data-code="' + c + '">✕</button>' : "");
    list.appendChild(row);
  }
  if (quotes._time) {
    $("footer").textContent = "更新於 " + new Date(quotes._time).toLocaleString("zh-TW")
      + "。金色=今年已公告現金股利÷收盤價;藍色=今年現金股利÷你的買進均價(點均價欄可輸入或修改)。資料來源:臺灣證券交易所、櫃買中心(收盤資料,非即時)。僅供參考,投資前請以公開資訊觀測站為準。";
  }
  list.querySelectorAll(".cost-cell").forEach((el) =>
    el.addEventListener("click", () => {
      const code = el.dataset.code;
      const cur = costs[code] != null ? costs[code] : "";
      const input = prompt("輸入 " + code + " 的買進均價(元):", cur);
      if (input === null) return; // 取消
      const v = parseFloat(String(input).replace(/,/g, "").trim());
      if (Number.isFinite(v) && v > 0) {
        costs[code] = v;
      } else if (String(input).trim() === "") {
        delete costs[code]; // 清空表示移除均價
      } else {
        alert("請輸入有效的數字");
        return;
      }
      localStorage.setItem("costs", JSON.stringify(costs));
      render();
    })
  );
  list.querySelectorAll(".del-btn").forEach((b) =>
    b.addEventListener("click", () => {
      codes = codes.filter((x) => x !== b.dataset.code);
      save(); render();
    })
  );
}

$("editBtn").addEventListener("click", () => {
  editing = !editing;
  $("editBtn").textContent = editing ? "完成" : "編輯";
  $("addRow").classList.toggle("hidden", !editing);
  render();
});
$("addBtn").addEventListener("click", addCode);
$("codeInput").addEventListener("keydown", (e) => { if (e.key === "Enter") addCode(); });
function addCode() {
  const c = $("codeInput").value.trim();
  if (!c) return;
  if (!codes.includes(c)) { codes.push(c); save(); }
  $("codeInput").value = "";
  render();
  refresh();
}
$("refreshBtn").addEventListener("click", refresh);

render();
refresh();
</script>
</body>
</html>
