name: update-data

on:
  schedule:
    - cron: "0 7 * * 1-5"
    - cron: "30 10 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: fetch data
        run: |
          mkdir -p data
          grab() {
            curl -skL --retry 3 --max-time 120 "$1" -o "data/$2" || echo "fail: $2"
            if [ -f "data/$2" ]; then
              head -c 1 "data/$2" | grep -q '\[' || rm -f "data/$2"
            fi
            return 0
          }
          grab "https://openapi.twse.com.tw/v1/exchangeReport/STOCK_DAY_ALL" twse_daily.json
          grab "https://openapi.twse.com.tw/v1/exchangeReport/BWIBBU_ALL" twse_yield.json
          grab "https://openapi.twse.com.tw/v1/opendata/t187ap45_L" twse_div.json
          grab "https://www.tpex.org.tw/openapi/v1/tpex_mainboard_daily_close_quotes" tpex_daily.json
          grab "https://www.tpex.org.tw/openapi/v1/tpex_mainboard_peratio_analysis" tpex_yield.json
          grab "https://www.tpex.org.tw/openapi/v1/tpex_exright_prepost" tpex_div.json
          ls -la data

      - name: commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "update data"
          git push
