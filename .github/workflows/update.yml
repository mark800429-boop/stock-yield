name: update-data

on:
  schedule:
    - cron: "0 8 * * 1-5"
    - cron: "30 9 * * 1-5"
    - cron: "0 11 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: fetch data
        run: |
          mkdir -p data
          grab() {
            url="$1"; out="$2"
            for i in 1 2 3 4 5; do
              curl -skL --max-time 120 \
                -H "User-Agent: Mozilla/5.0" \
                "$url" -o "data/$out"
              if [ -s "data/$out" ] && head -c 1 "data/$out" | grep -q '\['; then
                echo "ok: $out"
                return 0
              fi
              echo "retry $i: $out"
              sleep 10
            done
            echo "fail: $out (keep old file)"
            return 0
          }
          grab "https://www.twse.com.tw/rwd/zh/afterTrading/STOCK_DAY_ALL?response=open_data" twse_daily.json
          grab "https://www.twse.com.tw/rwd/zh/afterTrading/BWIBBU_ALL?response=open_data" twse_yield.json
          grab "https://www.twse.com.tw/rwd/zh/dividend/TWT49U?response=open_data" twse_div.json
          grab "https://www.tpex.org.tw/openapi/v1/tpex_mainboard_daily_close_quotes" tpex_daily.json
          grab "https://www.tpex.org.tw/openapi/v1/tpex_mainboard_peratio_analysis" tpex_yield.json
          grab "https://www.tpex.org.tw/openapi/v1/tpex_exright_prepost" tpex_div.json
          ls -la data

      - name: commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "update data"
          git push

      - name: rebuild pages
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages/builds
